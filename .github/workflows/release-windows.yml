name: Release Windows

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Short release notes
        required: true
        type: string
      signing_mode:
        description: Windows Authenticode signing mode (public releases are unsigned)
        required: true
        default: pilot-self-signed
        type: choice
        options:
          - pilot-self-signed
          - unsigned
          - production
      publish:
        description: Create a draft GitHub release with the installer, latest.json and checksums
        required: true
        default: false
        type: boolean
      pilot_update_version:
        description: Version for the isolated local updater pilot
        required: false
        type: string
      pilot_update_ca:
        description: Public local HTTPS test CA certificate as base64 DER
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.97.1
      - run: npm ci --ignore-scripts
      - name: Prepare isolated updater pilot
        if: ${{ inputs.pilot_update_version != '' || inputs.pilot_update_ca != '' }}
        shell: pwsh
        env:
          MYLFR_PILOT_VERSION: ${{ inputs.pilot_update_version }}
          MYLFR_PILOT_UPDATE_CA: ${{ inputs.pilot_update_ca }}
        run: |
          if ("${{ inputs.signing_mode }}" -ne "pilot-self-signed" -or "${{ inputs.publish }}" -ne "false") {
            throw "The isolated updater pilot must remain an unpublished pilot-signed artifact."
          }
          node scripts/prepare-updater-pilot.mjs
      - run: npm run security:policy
      - run: npm run catalogue:validate
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - name: Reject publication of pilot-signed builds
        if: ${{ inputs.publish && inputs.signing_mode == 'pilot-self-signed' }}
        shell: pwsh
        run: throw "A build signed with the self-signed pilot certificate must never be published."
      - name: Pin the runtime Windows update publisher
        shell: pwsh
        env:
          PILOT_THUMBPRINT: ${{ vars.PILOT_WINDOWS_CERTIFICATE_THUMBPRINT }}
          PRODUCTION_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $expected = if ("${{ inputs.signing_mode }}" -eq "pilot-self-signed") {
            $env:PILOT_THUMBPRINT
          } elseif ("${{ inputs.signing_mode }}" -eq "production") {
            $env:PRODUCTION_THUMBPRINT
          } else {
            ""
          }
          if ("${{ inputs.signing_mode }}" -ne "unsigned" -and $expected -notmatch '^[A-Fa-f0-9]{40}$') {
            throw "The expected Windows signer thumbprint is not configured as a repository variable."
          }
          "MYLFR_WINDOWS_SIGNER_THUMBPRINT=$expected" >> $env:GITHUB_ENV
          # Unsigned releases opt out of the Authenticode update check explicitly;
          # the Tauri updater signature still authenticates every update.
          if ("${{ inputs.signing_mode }}" -eq "unsigned") {
            "MYLFR_UNSIGNED_WINDOWS_RELEASE=1" >> $env:GITHUB_ENV
          }
      - name: Build unsigned Windows executable
        shell: pwsh
        env:
          MYLFR_PILOT_UPDATE_CA: ${{ inputs.pilot_update_ca }}
        run: |
          $buildArguments = @("--target", "x86_64-pc-windows-msvc", "--no-bundle")
          if ($env:MYLFR_RELEASE_BINARY) { $buildArguments += @("--features", "updater-pilot") }
          npm run desktop:build -- @buildArguments
      - name: Verify build output is unsigned
        if: ${{ inputs.signing_mode != 'unsigned' }}
        shell: pwsh
        run: |
          $binary = $env:MYLFR_RELEASE_BINARY ?? "mylfr-desktop.exe"
          $executable = "src-tauri/target/x86_64-pc-windows-msvc/release/$binary"
          if ((Get-AuthenticodeSignature $executable).Status -ne "NotSigned") {
            throw "The build job must produce an unsigned executable."
          }
      # Not shipped: the symbols turn a crash report's stack trace into
      # function names and lines. Keep a copy with each release's packages.
      - name: Keep debug symbols for crash reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mylfr-debug-symbols-windows
          if-no-files-found: error
          retention-days: 90
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/mylfr_desktop.pdb
            src-tauri/target/x86_64-pc-windows-msvc/release/${{ env.MYLFR_RELEASE_BINARY || 'mylfr-desktop.exe' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mylfr-unsigned-windows
          if-no-files-found: error
          path: |
            dist
            src-tauri/target/x86_64-pc-windows-msvc/release/${{ env.MYLFR_RELEASE_BINARY || 'mylfr-desktop.exe' }}

  sign-and-bundle:
    needs: build
    runs-on: windows-latest
    environment: signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Match the unsigned updater pilot build
        if: ${{ inputs.pilot_update_version != '' }}
        env:
          MYLFR_PILOT_VERSION: ${{ inputs.pilot_update_version }}
          MYLFR_PILOT_UPDATE_CA: ${{ inputs.pilot_update_ca }}
        run: node scripts/prepare-updater-pilot.mjs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mylfr-unsigned-windows
          path: .
      - name: Import and pin pilot code-signing certificate
        if: ${{ inputs.signing_mode == 'pilot-self-signed' }}
        id: pilot_certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.PILOT_WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.PILOT_WINDOWS_CERTIFICATE_PASSWORD }}
          EXPECTED_THUMBPRINT: ${{ vars.PILOT_WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "mylfr-pilot-code-signing.pfx"
          "certificate_path=$certificatePath" >> $env:GITHUB_OUTPUT
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $certificateInfo = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $certificatePath,
            $env:CERTIFICATE_PASSWORD,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          )
          if ($certificateInfo.Thumbprint -ne $env:EXPECTED_THUMBPRINT) {
            throw "The pilot PFX does not match the pinned thumbprint."
          }
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($certificate.Thumbprint -ne $env:EXPECTED_THUMBPRINT) {
            throw "The imported pilot certificate does not match the pinned thumbprint."
          }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Import and pin production code-signing certificate
        if: ${{ inputs.signing_mode == 'production' }}
        id: production_certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          EXPECTED_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "mylfr-code-signing.pfx"
          "certificate_path=$certificatePath" >> $env:GITHUB_OUTPUT
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $certificateInfo = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $certificatePath,
            $env:CERTIFICATE_PASSWORD,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          )
          if ($certificateInfo.Thumbprint -ne $env:EXPECTED_THUMBPRINT) {
            throw "The production PFX does not match the pinned thumbprint."
          }
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($certificate.Thumbprint -ne $env:EXPECTED_THUMBPRINT) {
            throw "The imported production certificate does not match the pinned thumbprint."
          }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Configure isolated signing and bundling
        shell: pwsh
        env:
          PILOT_THUMBPRINT: ${{ steps.pilot_certificate.outputs.thumbprint }}
          PRODUCTION_THUMBPRINT: ${{ steps.production_certificate.outputs.thumbprint }}
        run: |
          $thumbprint = if ("${{ inputs.signing_mode }}" -eq "pilot-self-signed") {
            $env:PILOT_THUMBPRINT
          } elseif ("${{ inputs.signing_mode }}" -eq "production") {
            $env:PRODUCTION_THUMBPRINT
          } else {
            ""
          }
          $override = @{}
          if ($thumbprint) {
            $signScript = (Resolve-Path "scripts/sign-windows-artifact.ps1").Path
            $override = @{ bundle = @{ windows = @{ signCommand = @{
              cmd = "powershell.exe"
              args = @("-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", $signScript, "%1")
            } } } }
            "WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV
            "WINDOWS_SIGNED_EXECUTABLE_PATH=$(Join-Path $env:RUNNER_TEMP 'mylfr-desktop-signed.exe')" >> $env:GITHUB_ENV
            "WINDOWS_SIGNING_LOG_PATH=$(Join-Path $env:RUNNER_TEMP 'mylfr-windows-signing.log')" >> $env:GITHUB_ENV
          }
          "TAURI_CONFIG=$($override | ConvertTo-Json -Depth 6 -Compress)" >> $env:GITHUB_ENV
      - name: Bundle installer and Tauri-signed updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- bundle --target x86_64-pc-windows-msvc --config "$env:TAURI_CONFIG"
      - name: Show Windows signing diagnostics
        if: ${{ failure() && inputs.signing_mode != 'unsigned' }}
        shell: pwsh
        run: |
          if (Test-Path $env:WINDOWS_SIGNING_LOG_PATH) {
            Get-Content $env:WINDOWS_SIGNING_LOG_PATH
          } else {
            Write-Warning "The Windows signing hook did not create a diagnostic log."
          }
      - name: Verify Authenticode signatures
        if: ${{ inputs.signing_mode != 'unsigned' }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (!$installer) { throw "The NSIS installer was not found." }
          if (!(Test-Path $env:WINDOWS_SIGNED_EXECUTABLE_PATH)) { throw "The preserved signed executable was not found." }
          foreach ($path in @($env:WINDOWS_SIGNED_EXECUTABLE_PATH, $installer.FullName)) {
            $signature = Get-AuthenticodeSignature $path
            if ($signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT) {
              throw "Unexpected Authenticode signer for $path."
            }
            $pilotTrustException = "${{ inputs.signing_mode }}" -eq "pilot-self-signed" -and
              $signature.Status -eq "UnknownError" -and
              $signature.StatusMessage -match "root certificate.*not trusted"
            if (!$pilotTrustException -and $signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $path`: $($signature.Status)."
            }
          }
      - name: Remove Authenticode certificate before release preparation
        if: ${{ always() && inputs.signing_mode != 'unsigned' }}
        shell: pwsh
        run: |
          $certificate = "Cert:\CurrentUser\My\$env:WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT"
          if (Test-Path $certificate) { Remove-Item $certificate -Force }
      - name: Prepare static release
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_CHANNEL: ${{ inputs.signing_mode }}
          MYLFR_RELEASE_BASE_URL: ${{ env.MYLFR_PILOT_RELEASE_BASE_URL }}
        run: npm run release:prepare
      # GitHub only offers build provenance attestations for public
      # repositories on this plan, so a private run skips this step.
      - name: Attest the installer's build provenance
        if: ${{ inputs.signing_mode != 'pilot-self-signed' && !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/downloads/*-setup.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mylfr-desktop-windows-${{ inputs.signing_mode }}
          if-no-files-found: error
          path: release
      - name: Clean up imported signing material
        if: ${{ always() }}
        shell: pwsh
        env:
          PILOT_THUMBPRINT: ${{ vars.PILOT_WINDOWS_CERTIFICATE_THUMBPRINT }}
          PRODUCTION_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          foreach ($thumbprint in @($env:PILOT_THUMBPRINT, $env:PRODUCTION_THUMBPRINT)) {
            if ($thumbprint -match '^[A-Fa-f0-9]{40}$') {
              $certificate = "Cert:\CurrentUser\My\$thumbprint"
              if (Test-Path $certificate) { Remove-Item $certificate -Force }
            }
          }
          foreach ($path in @(
            (Join-Path $env:RUNNER_TEMP "mylfr-pilot-code-signing.pfx"),
            (Join-Path $env:RUNNER_TEMP "mylfr-code-signing.pfx")
          )) {
            if ($path -and (Test-Path -LiteralPath $path)) { Remove-Item -LiteralPath $path -Force }
          }

  publish:
    if: ${{ inputs.publish }}
    needs: sign-and-bundle
    runs-on: windows-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mylfr-desktop-windows-${{ inputs.signing_mode }}
          path: release
      # A draft is invisible to receivers and to the updater's "latest" link
      # until the maintainer reviews and publishes it on GitHub.
      - name: Create a draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = @(Get-ChildItem release/downloads -File | ForEach-Object FullName) + @("release/latest.json", "release/SHA256SUMS.txt")
          foreach ($asset in $assets) { if (!(Test-Path -LiteralPath $asset)) { throw "Release asset $asset is missing." } }
          gh release create "v$version" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "myLFR Desktop $version" --notes $env:RELEASE_NOTES @assets
          if ($LASTEXITCODE -ne 0) { throw "Creating the draft GitHub release failed." }
