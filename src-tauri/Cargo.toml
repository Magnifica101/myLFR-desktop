[package]
name = "mylfr-desktop"
version = "1.0.0"
description = "Local-first desktop application for Licensed Fish Receivers"
authors = ["myLFR"]
license = "CC0-1.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "mylfr_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "mylfr-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = [
  "dep:tauri",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-updater",
  "dep:webview2-com",
  "dep:windows-core"
]
updater-pilot = ["desktop", "dep:pilot-update-http"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
pilot-update-http = { package = "reqwest", version = "0.13.4", default-features = false, optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
thiserror = "2.0.17"
tempfile = "3.23.0"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

tauri = { version = "2.12.1", optional = true, features = [] }
tauri-plugin-dialog = { version = "2.8.1", optional = true }
tauri-plugin-opener = { version = "2.7.0", optional = true }
tauri-plugin-updater = { version = "2.14.1", optional = true }

[profile.release]
# Function and line information goes into a separate .pdb file that is kept
# with each release, not shipped, so crash stack traces can be read.
debug = "line-tables-only"

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.39.1", optional = true }
windows-core = { version = "0.62.2", optional = true }

[dev-dependencies]
